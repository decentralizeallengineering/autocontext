[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autocontext"
version = "0.1.0"
description = "Choose a Claude Code context-window setting from measured session transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
autocontext = "autocontext.cli:main"

[tool.setuptools]
packages = ["autocontext"]
